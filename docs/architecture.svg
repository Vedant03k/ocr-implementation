<svg width="760" height="1000" viewBox="0 0 760 1000" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>OCR pipeline architecture: PaddleOCR, PaddleOCR-VL-1.5 and a word corrector</title>
<desc>An image or video flows through a frame sampler, then PaddleOCR detection and first-pass recognition on CPU. A confidence router keeps PaddleOCR's text for lines scoring at least 0.97 and sends the rest to PaddleOCR-VL-1.5 on the GPU. An output guard collapses repeated words and rejects refusals and formula-style misreads, falling back to PaddleOCR's text. Lines are merged in reading order, a SymSpell word corrector fixes misread words, and the result is returned as JSON.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .box { stroke-width: 0.5; rx: 4; }
  .gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .purple{ fill: #EEEDFE; stroke: #534AB7; }
  .teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .coral { fill: #FAECE7; stroke: #993C1D; }
  .blue  { fill: #E5F0FE; stroke: #1D4E99; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .tl { font-size: 11px; fill: #5F5E5A; }
  .tgray { fill: #2C2C2A; }
  .tpurple { fill: #26215C; }
  .tteal { fill: #04342C; }
  .tcoral { fill: #4A1B0C; }
  .tblue { fill: #0C2C57; }
  .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
  .dash { stroke-dasharray: 5 4; }
</style>

<!-- main flow -->
<line class="arr" x1="380" y1="80" x2="380" y2="130" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="190" x2="380" y2="240" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="316" x2="380" y2="366" marker-end="url(#arrow)"/>

<!-- router branches -->
<line class="arr" x1="330" y1="426" x2="190" y2="496" marker-end="url(#arrow)"/>
<text x="200" y="452" text-anchor="middle" class="tl">score ≥ 0.97 (~45% of lines)</text>
<line class="arr" x1="430" y1="426" x2="570" y2="496" marker-end="url(#arrow)"/>
<text x="580" y="452" text-anchor="middle" class="tl">score &lt; 0.97 (~55% of lines)</text>

<!-- specialist -> guard -->
<line class="arr" x1="570" y1="572" x2="570" y2="616" marker-end="url(#arrow)"/>

<!-- guard rejected -> keep PaddleOCR text -->
<path class="arr dash" d="M430 660 L 300 660 L 300 556" marker-end="url(#arrow)"/>
<text x="365" y="676" text-anchor="middle" class="tl">rejected (~3%)</text>

<!-- both paths -> merge -->
<line class="arr" x1="190" y1="556" x2="330" y2="746" marker-end="url(#arrow)"/>
<line class="arr" x1="570" y1="704" x2="430" y2="746" marker-end="url(#arrow)"/>
<text x="540" y="736" text-anchor="middle" class="tl">accepted</text>

<line class="arr" x1="380" y1="796" x2="380" y2="826" marker-end="url(#arrow)"/>
<line class="arr" x1="380" y1="886" x2="380" y2="916" marker-end="url(#arrow)"/>

<g>
  <rect class="box gray" x="280" y="30" width="200" height="50"/>
  <text x="380" y="50" text-anchor="middle" class="th tgray">Input</text>
  <text x="380" y="68" text-anchor="middle" class="ts tgray">Image or video file</text>
</g>

<g>
  <rect class="box gray" x="250" y="130" width="260" height="60"/>
  <text x="380" y="150" text-anchor="middle" class="th tgray">Frame sampler</text>
  <text x="380" y="168" text-anchor="middle" class="ts tgray">Video: 1 frame/s, near-duplicates dropped</text>
  <text x="380" y="183" text-anchor="middle" class="tl">Images pass through unchanged</text>
</g>

<g>
  <rect class="box purple" x="220" y="240" width="320" height="76"/>
  <text x="380" y="260" text-anchor="middle" class="th tpurple">PaddleOCR PP-OCRv6 (CPU)</text>
  <text x="380" y="278" text-anchor="middle" class="ts tpurple">Detects text lines on a 1280px copy of the image,</text>
  <text x="380" y="294" text-anchor="middle" class="ts tpurple">then reads each line with a confidence score</text>
  <text x="380" y="309" text-anchor="middle" class="tl">~17s per phone photo</text>
</g>

<g>
  <rect class="box gray" x="250" y="366" width="260" height="60"/>
  <text x="380" y="388" text-anchor="middle" class="th tgray">Confidence router</text>
  <text x="380" y="406" text-anchor="middle" class="ts tgray">Threshold 0.97 (GUI slider, sent per upload)</text>
</g>

<g>
  <rect class="box teal" x="70" y="496" width="240" height="60"/>
  <text x="190" y="518" text-anchor="middle" class="th tteal">Keep PaddleOCR text</text>
  <text x="190" y="536" text-anchor="middle" class="ts tteal">Fast path, confident lines</text>
</g>

<g>
  <rect class="box coral" x="430" y="496" width="280" height="76"/>
  <text x="570" y="516" text-anchor="middle" class="th tcoral">PaddleOCR-VL-1.5 (GPU)</text>
  <text x="570" y="534" text-anchor="middle" class="ts tcoral">0.9B vision-language model re-reads</text>
  <text x="570" y="550" text-anchor="middle" class="ts tcoral">the line crop: messy handwriting</text>
  <text x="570" y="565" text-anchor="middle" class="tl">~1.1s per line, 1.8 GB VRAM</text>
</g>

<g>
  <rect class="box coral" x="430" y="616" width="280" height="88"/>
  <text x="570" y="636" text-anchor="middle" class="th tcoral">Output guard</text>
  <text x="570" y="654" text-anchor="middle" class="ts tcoral">Collapses loops ("Ave Ave Ave …"),</text>
  <text x="570" y="670" text-anchor="middle" class="ts tcoral">caps length by crop shape; rejects prose</text>
  <text x="570" y="686" text-anchor="middle" class="ts tcoral">answers and maths/LaTeX misreads</text>
</g>

<g>
  <rect class="box gray" x="250" y="746" width="260" height="50"/>
  <text x="380" y="766" text-anchor="middle" class="th tgray">Merge &amp; reorder</text>
  <text x="380" y="784" text-anchor="middle" class="ts tgray">Lines back in reading order</text>
</g>

<g>
  <rect class="box blue" x="230" y="826" width="300" height="60"/>
  <text x="380" y="846" text-anchor="middle" class="th tblue">Word corrector (SymSpell)</text>
  <text x="380" y="864" text-anchor="middle" class="ts tblue">Fixes misread words using dictionary +</text>
  <text x="380" y="879" text-anchor="middle" class="ts tblue">neighbouring-word context; raw text kept</text>
</g>

<g>
  <rect class="box gray" x="230" y="916" width="300" height="60"/>
  <text x="380" y="936" text-anchor="middle" class="th tgray">Output (JSON)</text>
  <text x="380" y="954" text-anchor="middle" class="ts tgray">Raw + corrected text, boxes, confidences,</text>
  <text x="380" y="969" text-anchor="middle" class="ts tgray">timestamps for video</text>
</g>
</svg>
