<svg width="680" height="830" viewBox="0 0 680 830" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
<title>OCR pipeline architecture combining PaddleOCR, GOT-OCR2.0 and an LLM cleanup stage</title>
<desc>Image or video input flows through a frame sampler, then PaddleOCR text detection, then a confidence router that sends printed text to the PaddleOCR recognizer and messy handwriting to GOT-OCR2.0, then merges into reading order, then an LLM cleanup stage corrects OCR spelling errors, before final JSON output.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .box { stroke-width: 0.5; rx: 4; }
  .gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .purple{ fill: #EEEDFE; stroke: #534AB7; }
  .teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .coral { fill: #FAECE7; stroke: #993C1D; }
  .blue  { fill: #E5F0FE; stroke: #1D4E99; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .tgray { fill: #2C2C2A; }
  .tpurple { fill: #26215C; }
  .tteal { fill: #04342C; }
  .tcoral { fill: #4A1B0C; }
  .tblue { fill: #0C2C57; }
  .arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
</style>

<line class="arr" x1="340" y1="90" x2="340" y2="140" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="190" x2="340" y2="240" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="290" x2="340" y2="340" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="390" x2="180" y2="440" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="390" x2="500" y2="440" marker-end="url(#arrow)"/>
<line class="arr" x1="180" y1="490" x2="340" y2="540" marker-end="url(#arrow)"/>
<line class="arr" x1="500" y1="490" x2="340" y2="540" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="590" x2="340" y2="640" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="690" x2="340" y2="740" marker-end="url(#arrow)"/>

<g>
  <rect class="box gray" x="250" y="40" width="180" height="50"/>
  <text x="340" y="60" text-anchor="middle" class="th tgray">Input</text>
  <text x="340" y="78" text-anchor="middle" class="ts tgray">Image or video file</text>
</g>

<g>
  <rect class="box gray" x="240" y="140" width="200" height="50"/>
  <text x="340" y="160" text-anchor="middle" class="th tgray">Frame sampler</text>
  <text x="340" y="178" text-anchor="middle" class="ts tgray">Samples video into frames</text>
</g>

<g>
  <rect class="box purple" x="230" y="240" width="220" height="50"/>
  <text x="340" y="260" text-anchor="middle" class="th tpurple">PaddleOCR detector</text>
  <text x="340" y="278" text-anchor="middle" class="ts tpurple">Finds text-line boxes</text>
</g>

<g>
  <rect class="box gray" x="230" y="340" width="220" height="50"/>
  <text x="340" y="360" text-anchor="middle" class="th tgray">Confidence router</text>
  <text x="340" y="378" text-anchor="middle" class="ts tgray">Routes handwriting vs printed</text>
</g>

<g>
  <rect class="box teal" x="80" y="440" width="200" height="50"/>
  <text x="180" y="460" text-anchor="middle" class="th tteal">PaddleOCR recognizer</text>
  <text x="180" y="478" text-anchor="middle" class="ts tteal">Fast path, printed text</text>
</g>

<g>
  <rect class="box coral" x="400" y="440" width="200" height="50"/>
  <text x="500" y="460" text-anchor="middle" class="th tcoral">GOT-OCR2.0 specialist</text>
  <text x="500" y="478" text-anchor="middle" class="ts tcoral">Messy handwriting path</text>
</g>

<g>
  <rect class="box gray" x="230" y="540" width="220" height="50"/>
  <text x="340" y="560" text-anchor="middle" class="th tgray">Merge &amp; reorder</text>
  <text x="340" y="578" text-anchor="middle" class="ts tgray">Post-process, reading order</text>
</g>

<g>
  <rect class="box blue" x="220" y="640" width="240" height="50"/>
  <text x="340" y="660" text-anchor="middle" class="th tblue">LLM cleanup</text>
  <text x="340" y="678" text-anchor="middle" class="ts tblue">Corrects OCR spelling errors</text>
</g>

<g>
  <rect class="box gray" x="220" y="740" width="240" height="50"/>
  <text x="340" y="760" text-anchor="middle" class="th tgray">Output</text>
  <text x="340" y="778" text-anchor="middle" class="ts tgray">Text, boxes, timestamps (JSON)</text>
</g>
</svg>
