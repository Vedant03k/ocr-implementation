# The orchestrator is a plain FastAPI app (not a "model"), so it's a regular
# Deployment/Service/HPA rather than a KServe InferenceService.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: ocr-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: <ECR_REPO>/orchestrator:latest # replace after `docker push`
          ports:
            - containerPort: 8000
          env:
            # In-cluster KServe DNS names, once the InferenceServices below are applied.
            - name: PADDLEOCR_URL
              value: http://paddleocr.ocr-pipeline.svc.cluster.local/v1/models/paddleocr:predict
            - name: GOT_OCR2_URL
              value: http://got-ocr2.ocr-pipeline.svc.cluster.local/v1/models/got-ocr2:predict
            - name: LLM_CLEANUP_URL
              value: http://llm-cleanup.ocr-pipeline.svc.cluster.local/openai/v1/chat/completions
            - name: OCR_CORS_ORIGINS
              value: "https://<your-vercel-app>.vercel.app" # replace with the real frontend URL
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: ocr-pipeline
spec:
  selector:
    app: orchestrator
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer # provisions an AWS NLB; swap for ClusterIP + Ingress if you front it with one
