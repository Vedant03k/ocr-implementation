# GOT-OCR2.0: custom predictor. Weights (~1.1GB) are NOT baked into the
# image — an explicit init container pulls them from S3 into an emptyDir
# shared with the main container at pod startup, using KServe's standalone
# storage-initializer image. (We use an explicit init container rather than
# KServe's automatic storageUri-on-custom-containers wiring, since that
# wiring varies across KServe versions — this pattern is version-independent
# and easy to verify with `kubectl describe pod`.)
#
# CPU, not GPU: this account's G/VT instance quota is 0 with no approved
# increase (see deploy/README.md "Current deployment status"). Runs on the
# existing cpu-workers nodegroup instead of waiting on AWS. Slower per
# request, but GotOcrRecognizer already falls back to CPU automatically when
# CUDA isn't available, so no code change was needed. Revert nodeSelector/
# tolerations/resources below to the GPU versions (see git history) once the
# quota clears.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: got-ocr2
  namespace: ocr-pipeline
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    nodeSelector:
      workload: cpu
    initContainers:
      - name: fetch-weights
        image: kserve/storage-initializer:latest
        args:
          - s3://ocr-pipeline-models-711446557912/models/got_ocr2/v1/
          - /mnt/models
        volumeMounts:
          - name: model-store
            mountPath: /mnt/models
    containers:
      - name: kserve-container
        image: 711446557912.dkr.ecr.us-east-1.amazonaws.com/ocr-pipeline/got-ocr2:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: GOT_OCR2_MODEL_DIR
            value: /mnt/models
          - name: GOT_OCR2_DEVICE
            value: cpu
        volumeMounts:
          - name: model-store
            mountPath: /mnt/models
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 6Gi
    volumes:
      - name: model-store
        emptyDir: {}
