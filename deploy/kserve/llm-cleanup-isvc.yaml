# LLM cleanup (Qwen2.5-1.5B-Instruct): custom predictor, CPU.
#
# Originally KServe's built-in HuggingFace ServingRuntime with the vLLM
# backend (continuous batching, paged attention) — switched to a custom
# container running plain transformers.generate() on CPU because vLLM has no
# practical CPU inference path, and this account's G/VT GPU quota is 0 with
# no approved increase (see deploy/README.md "Current deployment status").
# Reuses ocr_pipeline.cleanup.TextCleaner directly (same code the local dev
# pipeline uses), so cleanup behavior matches local dev exactly — see
# deploy/serving/llm_cleanup_server.py. Revert to the vLLM ServingRuntime
# below (see git history) once GPU quota clears, for real batching/throughput.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llm-cleanup
  namespace: ocr-pipeline
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    nodeSelector:
      workload: cpu
    initContainers:
      - name: fetch-weights
        image: kserve/storage-initializer:latest
        args:
          - s3://ocr-pipeline-models-711446557912/models/llm_cleanup/v1/
          - /mnt/models
        volumeMounts:
          - name: model-store
            mountPath: /mnt/models
    containers:
      - name: kserve-container
        image: 711446557912.dkr.ecr.us-east-1.amazonaws.com/ocr-pipeline/llm-cleanup:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
            protocol: TCP
        env:
          - name: LLM_CLEANUP_MODEL_DIR
            value: /mnt/models
          - name: LLM_CLEANUP_DEVICE
            value: cpu
        volumeMounts:
          - name: model-store
            mountPath: /mnt/models
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 6Gi
    volumes:
      - name: model-store
        emptyDir: {}
