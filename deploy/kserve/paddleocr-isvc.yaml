# PaddleOCR: custom predictor, CPU-only, weights baked into the image (see
# deploy/docker/paddleocr.Dockerfile) since they're small and don't need a GPU
# node's storage-initializer step.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: paddleocr
  namespace: ocr-pipeline
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 5
    scaleTarget: 10
    scaleMetric: concurrency
    containers:
      - name: kserve-container
        image: <ECR_REPO>/paddleocr:latest # replace after `docker push`
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
